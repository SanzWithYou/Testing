<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanz Store - Game Account Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#6366F1', // Indigo 500
              secondary: '#3B82F6', // Blue 500
              dark: '#0f172a', // Slate 900
              'neon-blue': '#00BFFF',
              'neon-pink': '#FF00FF',
            },
            fontFamily: {
              sans: ['Urbanist', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-out': 'fadeOut 0.3s ease-out forwards',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'zoom-in': 'zoomIn 0.5s ease-out forwards',
              'zoom-out': 'zoomOut 0.3s ease-out forwards',
              'aurora': 'aurora 20s linear infinite alternate',
            },
            keyframes: {
              fadeIn: { 'from': { opacity: 0 }, 'to': { opacity: 1 } },
              fadeOut: { 'from': { opacity: 1 }, 'to': { opacity: 0 } },
              slideUp: { 'from': { transform: 'translateY(20px)', opacity: 0 }, 'to': { transform: 'translateY(0)', opacity: 1 } },
              zoomIn: { 'from': { transform: 'scale(0.95)', opacity: 0 }, 'to': { transform: 'scale(1)', opacity: 1 } },
              zoomOut: { 'from': { transform: 'scale(1)', opacity: 1 }, 'to': { transform: 'scale(0.95)', opacity: 0 } },
              aurora: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.10.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.525.0",
    "axios": "https://esm.sh/axios@^1.11.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-900 dark:bg-dark text-slate-800 dark:text-slate-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
